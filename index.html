<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#FFFFFF">
    
    <!-- Primary Meta Tags -->
    <title>Sinjeon Canada | The New Standard of Topokki</title>
    <meta name="title" content="Sinjeon Canada | The New Standard of Topokki">
    <meta name="description" content="From Korea to Canada. Experience the authentic, HACCP-certified K-Spice that captivated over 800 locations worldwide.">

    <link rel="icon" type="image/png" href="sinjeon_logo_canada.png">
    
    <!-- ★ 핵심 에셋 사전 로딩 -->
    <link rel="preload" href="background/base_1.JPG" as="image">
    <link rel="preload" href="character/character_7.png" as="image">
    <link rel="preload" href="fonts/SinjeonFont.otf" as="font" type="font/otf" crossorigin>
    
    <!-- FontAwesome & EmailJS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <!-- ★ Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. Core Reset & Typography
           ========================================= */
        html, body {
            width: 100%; max-width: 100vw; overflow-x: hidden !important; position: relative;
            -webkit-user-select: none; -moz-user-select: none; user-select: none;
            scroll-behavior: smooth; margin: 0; padding: 0; box-sizing: border-box;
        }
        input, textarea, select { user-select: auto; font-family: 'Outfit', sans-serif; }
        img { user-drag: none; -webkit-user-drag: none; max-width: 100%; height: auto; display: block; object-fit: contain;}
        *:focus-visible { outline: 3px solid #D24B41; outline-offset: 2px; border-radius: 6px; }

        @font-face {
            font-family: 'SinjeonCustom';
            src: url('fonts/SinjeonFont.otf') format('opentype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            --sj-green: #008250; --sj-red: #D24B41; 
            --text-dark: #1A1A1A; --text-gray: #666666; --text-light: #A0AEC0;
            --bg-light: #F8FAFC; --bg-white: #FFFFFF; --border-color: #E2E8F0;
            --uber-green: #06C167; --google-yellow: #FBBC04;
            --transition-fast: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 25px 50px -12px rgba(210, 75, 65, 0.15);
            --border-radius-lg: 24px; --border-radius-md: 16px;
        }

        * { box-sizing: inherit; }
        body { font-family: 'Outfit', 'Poppins', 'Noto Sans KR', sans-serif; color: var(--text-dark); background-color: var(--bg-white); line-height: 1.6; -webkit-font-smoothing: antialiased; }

        .scroll-progress { position: fixed; top: 0; left: 0; height: 4px; background: var(--sj-red); z-index: 1001; width: 0%; transition: width 0.1s linear; }

        .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; will-change: opacity, transform; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .section-header { text-align: center; margin-bottom: 50px; padding: 0 20px; }
        .section-header h2 { font-size: 3rem; font-weight: 900; color: var(--text-dark); letter-spacing: -1px; margin-bottom: 10px; text-transform: uppercase;}
        .section-header h2 span { color: var(--sj-red); font-family: 'SinjeonCustom', sans-serif; font-weight: normal; font-size: 3.5rem; }
        .section-header p { font-size: 1rem; color: var(--sj-green); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }

        /* 플로팅 애니메이션 */
        @keyframes float-normal { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-12px) rotate(2deg); } }
        @keyframes float-slow { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-8px) rotate(-2deg); } }
        @keyframes float-fast { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-16px) rotate(3deg); } }
        .char-img { position: absolute; z-index: 5; pointer-events: auto; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.12)); transition: transform var(--transition-fast); }
        .char-img:hover { transform: scale(1.1) translateY(-5px) !important; cursor: pointer; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.2)); }

        /* =========================================
           2. Popup System
           ========================================= */
        .event-popup-wrapper {
            position: fixed; top: 110px; left: 20px; z-index: 99999; 
            opacity: 0; visibility: hidden; transform: translateX(-30px); 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .event-popup-wrapper.show { opacity: 1; visibility: visible; transform: translateX(0); pointer-events: auto; }
        .event-popup-content {
            background: var(--bg-white); border-radius: 16px; width: fit-content; 
            max-width: calc(100vw - 40px); overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15); border: 1px solid var(--border-color);
            display: flex; flex-direction: column;
        }
        .popup-image-container {
            display: flex; flex-direction: row; overflow-x: auto; overflow-y: hidden;
            background: var(--bg-white); max-width: 100%; -webkit-overflow-scrolling: touch;
        }
        .popup-image-container::-webkit-scrollbar { height: 6px; }
        .popup-image-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .popup-image-container div { flex: 0 0 320px; width: 320px; border-right: 1px solid var(--border-color); }
        .popup-image-container div:last-child { border-right: none; }
        .popup-image-container img { width: 100%; height: auto; display: block; min-height: 100px;}
        
        .event-popup-actions { display: flex; border-top: 1px solid var(--border-color); width: 100%; }
        .event-popup-actions button { flex: 1; padding: 14px 0; border: none; background: var(--bg-light); font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: var(--transition-fast); font-family: 'Noto Sans KR', sans-serif; }
        .btn-hide-24h { color: var(--text-gray); border-right: 1px solid var(--border-color) !important; }
        .btn-hide-24h:hover { background: #e2e8f0; color: var(--text-dark); }
        .btn-close-popup { color: var(--sj-red); }
        .btn-close-popup:hover { background: #fdf2f2; }

        /* =========================================
           3. Header & Navigation
           ========================================= */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 5%; background: rgba(255, 255, 255, 0.95); 
            position: fixed; width: 100%; top: 0; z-index: 1000; 
            backdrop-filter: blur(10px); border-bottom: 1px solid transparent; 
            transition: var(--transition-fast); 
        }
        header.scrolled { padding: 10px 5%; border-bottom: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.04); background: rgba(255, 255, 255, 0.98); }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1400px; margin: 0 auto; }
        
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0; position: relative; z-index: 1002;}
        .logo-container img { height: 40px; transition: var(--transition-fast); }
        .logo-container span { font-family: 'SinjeonCustom', sans-serif; font-size: 1.5rem; font-weight: normal; color: var(--sj-green); letter-spacing: -0.5px; margin-top: 4px;}
        
        .nav-wrapper { display: flex; align-items: center; gap: 35px; justify-content: flex-end; flex: 1; }
        
        .desktop-nav { display: flex; gap: 25px; align-items: center; }
        .desktop-nav a { text-decoration: none; color: var(--text-dark); font-weight: 700; font-size: 0.9rem; position: relative; padding: 5px 0; transition: color var(--transition-fast); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;}
        .desktop-nav a::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -2px; left: 0; background-color: var(--sj-red); transition: width var(--transition-fast); }
        .desktop-nav a:hover { color: var(--sj-red); }
        .desktop-nav a:hover::after { width: 100%; }

        .header-cta-group { display: flex; align-items: center; flex-shrink: 0; margin-left: 10px; position: relative; z-index: 1002;}
        .header-btn-apply { background: var(--sj-red); color: white !important; font-size: 0.9rem; font-weight: 800; padding: 12px 28px; border-radius: 50px; text-decoration: none; text-transform: uppercase; transition: var(--transition-fast); box-shadow: 0 4px 15px rgba(210, 75, 65, 0.3); white-space: nowrap; letter-spacing: 0.5px;}
        .header-btn-apply:hover { background: #b83e35; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(210, 75, 65, 0.4);}
        .header-btn-apply::after { display: none !important; }

        .mobile-menu-btn { display: none; font-size: 1.8rem; color: var(--text-dark); background: none; border: none; cursor: pointer; z-index: 1002; position: relative; padding: 5px; margin-left: 15px;}
        .mobile-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-white); z-index: 1001; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: var(--transition-fast); transform: translateY(-20px); }
        .mobile-overlay.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .mobile-nav-links { display: flex; flex-direction: column; gap: 25px; text-align: center; }
        .mobile-nav-links a { font-size: 1.8rem; font-weight: 800; color: var(--text-dark); text-decoration: none; text-transform: uppercase; letter-spacing: 1px; transition: color var(--transition-fast); }
        .mobile-nav-links a:hover { color: var(--sj-red); }

        /* =========================================
           4. Hero Section
           ========================================= */
        .hero { padding: 200px 5% 100px; text-align: center; position: relative; background: radial-gradient(circle at center, rgba(255,255,255,0.95) 0%, rgba(248,250,252,0.98) 100%), url('background/base_1.JPG') center/cover no-repeat, var(--bg-light); background-attachment: fixed; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        .hero-badge { display: inline-block; padding: 8px 24px; background: rgba(0, 130, 80, 0.08); color: var(--sj-green); border-radius: 50px; font-size: 0.85rem; font-weight: 800; margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; }
        .hero h1 { font-family: 'Outfit', sans-serif; font-size: 4.5rem; margin: 0; letter-spacing: -2px; line-height: 1.1; font-weight: 900; color: var(--text-dark); text-transform: uppercase; position: relative; z-index: 2;}
        .hero h1 span.highlight { color: var(--sj-red); display: block; font-family: 'SinjeonCustom', sans-serif; font-weight: normal; font-size: 5.5rem; letter-spacing: -1px; margin-top: 5px;}
        .hero > p { font-size: 1.15rem; color: var(--text-gray); margin-top: 20px; font-weight: 500; max-width: 600px; position: relative; z-index: 2;}
        
        .char-hero { width: 160px; right: 15%; top: 25%; animation: float-normal 4.5s ease-in-out infinite;} 

        /* =========================================
           5. About & Core Values
           ========================================= */
        .about-section { padding: 120px 5%; background: var(--bg-white); }
        .bento-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .bento-item { background: var(--bg-light); border-radius: var(--border-radius-lg); padding: 40px 35px; border: 1px solid var(--border-color); position: relative; overflow: visible; transition: var(--transition-fast); display: flex; flex-direction: column; justify-content: center; text-align: left; }
        .bento-item:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--sj-green); background: var(--bg-white); }
        .bento-large { grid-column: span 3; background: var(--text-dark); color: var(--bg-white); display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; align-items: center; padding: 40px; border: none;}
        
        .stat-item { padding: 10px; }
        .stat-item h4 { font-family: 'SinjeonCustom', sans-serif; font-weight: normal; font-size: 3.5rem; color: var(--sj-red); margin-bottom: 5px; line-height: 1; }
        .stat-item p { font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.7); margin: 0; }
        .value-icon { width: 60px; height: 60px; background: rgba(210, 75, 65, 0.1); color: var(--sj-red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; }
        .bento-item h3 { font-size: 1.5rem; font-weight: 800; color: var(--sj-green); margin-bottom: 12px; }
        .bento-item p { font-size: 1rem; color: var(--text-gray); line-height: 1.6; font-weight: 500; }
        
        .btn-clean-heat-sm { margin-top: 20px; padding: 12px 24px; background: transparent; color: var(--sj-red); border: 2px solid var(--sj-red); border-radius: 30px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: var(--transition-fast); width: max-content; }
        .btn-clean-heat-sm:hover { background: var(--sj-red); color: var(--bg-white); box-shadow: var(--shadow-sm); }
        .char-bento-1 { width: 90px; bottom: -20px; right: -10px; animation: float-slow 6s ease-in-out infinite 0.5s;}
        .char-bento-2 { width: 80px; top: -30px; right: 20px; animation: float-fast 3.5s ease-in-out infinite 1s;}

        /* =========================================
           6. Spice Guide
           ========================================= */
        .spice-section { padding: 120px 5%; background: var(--bg-light); border-top: 1px solid var(--border-color); }
        .spice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; max-width: 1100px; margin: 0 auto; }
        .spice-card { padding: 50px 30px; border-radius: var(--border-radius-lg); text-align: center; position: relative; overflow: visible; background: var(--bg-white); border: 1px solid var(--border-color); transition: var(--transition-fast); z-index: 1; cursor: pointer; }
        .spice-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0; transition: var(--transition-fast); border-radius: var(--border-radius-lg); }
        .spice-card:hover { transform: translateY(-8px); border-color: transparent; box-shadow: var(--shadow-lg); color: var(--bg-white); }
        .spice-card:hover::before { opacity: 1; }
        .spice-mild::before { background: linear-gradient(135deg, #008250, #005c38); }
        .spice-medium::before { background: linear-gradient(135deg, #F29A2E, #E67E22); }
        .spice-spicy::before { background: linear-gradient(135deg, #D24B41, #a3352d); }
        
        .spice-level-num { font-family: 'SinjeonCustom', sans-serif; font-size: 3rem; opacity: 0.05; position: absolute; top: 20px; left: 25px; transition: var(--transition-fast); }
        .spice-card:hover .spice-level-num { opacity: 0.3; color: var(--bg-white); }
        .spice-card h3 { font-family: 'SinjeonCustom', sans-serif; font-weight: normal; font-size: 2rem; margin-top: 30px; margin-bottom: 10px; transition: color var(--transition-fast);}
        .spice-card p { font-size: 1rem; color: var(--text-gray); transition: color var(--transition-fast); line-height: 1.5;}
        .spice-card:hover h3, .spice-card:hover p { color: var(--bg-white); }
        .char-spice { width: 110px; position: absolute; top: -55px; left: 50%; transform: translateX(-50%); z-index: 10; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); transition: transform var(--transition-fast); }
        .spice-card:hover .char-spice { transform: translateX(-50%) scale(1.1) translateY(-10px); }

        /* =========================================
           7. Categorized Menu Section
           ========================================= */
        .menu-section { padding: 120px 5%; background: var(--bg-white); text-align: center; border-top: 1px solid var(--border-color); }
        .menu-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; }
        .menu-tab-btn { background: var(--bg-light); border: 1px solid var(--border-color); color: var(--text-gray); padding: 12px 30px; border-radius: 50px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: var(--transition-fast); text-transform: uppercase; }
        .menu-tab-btn:hover { background: var(--bg-white); border-color: var(--sj-red); color: var(--sj-red); }
        .menu-tab-btn.active { background: var(--sj-red); color: var(--bg-white); border-color: var(--sj-red); box-shadow: 0 4px 15px rgba(210, 75, 65, 0.2); }

        .menu-grid-container { max-width: 1200px; margin: 0 auto; min-height: 400px; position: relative; } 
        
        .menu-grid { 
            display: none; 
            grid-template-columns: repeat(auto-fit, minmax(260px, 280px)); 
            justify-content: center; 
            gap: 30px; 
            opacity: 0; 
            transition: opacity 0.4s ease; 
        }
        .menu-grid.active { display: grid; opacity: 1; animation: fadeInMenu 0.3s ease-in-out; }
        @keyframes fadeInMenu { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .menu-item { background: var(--bg-white); border-radius: var(--border-radius-md); padding: 30px 20px 25px; border: 1px solid var(--border-color); transition: var(--transition-fast); display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 100%;}
        .menu-item:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--sj-green); }
        
        .menu-item-img { 
            width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; 
            margin-bottom: 20px; background: #f8fafc; border-radius: 12px;
        }
        .menu-item-img img { max-width: 90%; max-height: 90%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.08)); transition: transform var(--transition-fast); }
        .menu-item:hover .menu-item-img img { transform: scale(1.1) rotate(2deg); filter: drop-shadow(0 15px 20px rgba(0,0,0,0.12));}
        
        .menu-item h3 { font-size: 1.25rem; font-weight: 800; color: var(--text-dark); margin-bottom: 4px; line-height: 1.2; text-align: center;}
        .menu-item .menu-kor { font-family: 'SinjeonCustom', sans-serif; font-size: 1.1rem; color: var(--sj-red); font-weight: normal; margin-bottom: 8px;}
        .menu-item .menu-eng { font-size: 0.9rem; color: var(--text-gray); font-weight: 500; line-height: 1.4; text-align: center;}

        .menu-disclaimer { margin-top: 40px; font-size: 0.95rem; color: var(--text-light); font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* =========================================
           8. Locations & Feature Tags
           ========================================= */
        .locations { padding: 120px 5%; background: var(--bg-light); border-top: 1px solid var(--border-color); }
        .split-layout { display: flex; max-width: 1300px; margin: 0 auto; background: var(--bg-white); border-radius: var(--border-radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); height: 700px; }
        .loc-list-wrapper { flex: 0 0 42%; overflow-y: auto; padding: 30px; }
        .loc-list-wrapper::-webkit-scrollbar { width: 6px; }
        .loc-list-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .loc-item { background: var(--bg-light); border-radius: 16px; padding: 30px 25px; margin-bottom: 20px; border: 2px solid transparent; cursor: pointer; transition: var(--transition-fast); display: flex; flex-direction: column;}
        .loc-item:hover { background: var(--bg-white); border-color: #e2e8f0; }
        .loc-item.active { border-color: var(--sj-red); box-shadow: var(--shadow-md); background: var(--bg-white); }
        
        .loc-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .loc-status { font-weight: 800; font-size: 0.8rem; padding: 6px 12px; border-radius: 20px; text-transform: uppercase;}
        .loc-status.open { color: var(--uber-green); background: rgba(6,193,103,0.1); }
        .loc-status.closed { color: var(--sj-red); background: rgba(210, 75, 65, 0.1); }
        .loc-rating { font-size: 0.85rem; font-weight: 800; color: var(--text-dark); background: #fef9c3; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; }
        .loc-rating i { color: var(--google-yellow); font-size: 0.85rem;}

        .loc-item h3 { font-size: 1.6rem; font-weight: 800; color: var(--text-dark); margin-bottom: 12px; letter-spacing: -0.5px;}
        .loc-info-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        .loc-info-list p { display: flex; align-items: flex-start; gap: 10px; font-size: 0.9rem; color: var(--text-gray); line-height: 1.5; font-weight: 500; margin: 0;}
        .loc-info-list i { color: var(--sj-red); font-size: 1rem; width: 16px; text-align: center; margin-top: 3px; }
        
        .feature-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .feature-tag { font-size: 0.8rem; padding: 6px 14px; background: rgba(0, 130, 80, 0.05); color: var(--sj-green); font-weight: 800; border-radius: 50px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(0, 130, 80, 0.1); transition: var(--transition-fast);}
        .feature-tag i { font-size: 0.9rem; }
        .feature-tag:hover { background: var(--sj-green); color: white; }

        .loc-actions { display: flex; gap: 10px; margin-top: auto; }
        .btn-sm { padding: 12px 15px; border-radius: 10px; font-weight: 700; text-decoration: none; font-size: 0.9rem; flex: 1; text-align: center; transition: var(--transition-fast); display: flex; align-items: center; justify-content: center; gap: 6px;}
        .btn-outline { border: 2px solid var(--border-color); color: var(--text-dark); background: var(--bg-white); }
        .btn-outline:hover { border-color: var(--sj-green); color: var(--sj-green); }
        .btn-fill { background: var(--uber-green); color: var(--bg-white); border: 2px solid var(--uber-green); }
        .btn-fill:hover { background: #05a659; border-color: #05a659;}

                    }

                    const fabContainer = document.getElementById('fab-container');
                    if (window.scrollY > 500) fabContainer.classList.add('visible');
                    else fabContainer.classList.remove('visible');
                    
                    ticking = false;
                });
                ticking = true;
            }
        }, { passive: true });

        function updateStoreStatuses() {
            const storeCards = document.querySelectorAll('.store-card');
            storeCards.forEach(card => {
                try {
                    const tz = card.getAttribute('data-timezone');
                    if (!tz) return;

                    const dateInTz = new Date(new Date().toLocaleString("en-US", {timeZone: tz}));
                    let currentHour = dateInTz.getHours();
                    const currentMin = dateInTz.getMinutes();
                    const currentDay = dateInTz.getDay(); 
                    
                    const currentTimeVal = currentHour + (currentMin / 60);
                    let openHour = parseFloat(card.getAttribute('data-open') || 11);
                    let closeHour = parseFloat(card.getAttribute('data-close') || 22);
                    
                    if (card.hasAttribute('data-close-weekend') && (currentDay === 5 || currentDay === 6)) {
                        closeHour = parseFloat(card.getAttribute('data-close-weekend'));
                    }

                    let isOpen = false;
                    let adjustedCurrent = currentTimeVal;
                    let adjustedClose = closeHour;
                    
                    if (closeHour <= openHour) { 
                        adjustedClose += 24;
                        if (currentTimeVal < openHour) { adjustedCurrent += 24; }
                    }

                    if (adjustedCurrent >= openHour && adjustedCurrent < adjustedClose) { isOpen = true; }

                    function formatTime(decimalTime) {
                        let h = Math.floor(decimalTime);
                        let m = Math.round((decimalTime - h) * 60);
                        let ampm = h >= 12 && h < 24 ? 'PM' : 'AM';
                        h = h % 12; if (h === 0) h = 12;
                        let mStr = m > 0 ? ':' + (m < 10 ? '0'+m : m) : '';
                        return `${h}${mStr} ${ampm}`;
                    }

                    const badge = card.querySelector('.loc-status');
                    if (badge) {
                        if (isOpen) {
                            badge.innerHTML = `Open Now (Closes ${formatTime(closeHour)})`;
                            badge.className = "loc-status open";
                        } else {
                            badge.innerHTML = `Closed (Opens ${formatTime(openHour)})`;
                            badge.className = "loc-status closed";
                        }
                    }
                } catch(e) { console.error("Hours Error:", e); }
            });
        }
    </script>

    <!-- Leaflet Map Initialization & Controls -->
    <script>
        let map;
        let markers = [];
        
        function initMap() {
            map = L.map('main-map', {zoomControl: false}).setView([43.7780, -79.4168], 15);
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors',
                maxZoom: 19
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            const sinjeonIcon = L.icon({
                iconUrl: 'sinjeon_logo_canada.png',
                iconSize: [40, 40],
                iconAnchor: [20, 40],
                popupAnchor: [0, -40]
            });

            const locationsData = [
                { lat: 43.7780, lng: -79.4168, title: "Sinjeon Finch" },
                { lat: 43.6635, lng: -79.4187, title: "Sinjeon Christie" },
                { lat: 49.2480, lng: -122.8943, title: "Sinjeon Lougheed" },
                { lat: 43.6590, lng: -79.3780, title: "Sinjeon Church" }
            ];

            locationsData.forEach((loc) => {
                const marker = L.marker([loc.lat, loc.lng], {icon: sinjeonIcon}).addTo(map);
                marker.bindPopup(`<b>${loc.title}</b>`);
                markers.push(marker);
            });
        }

        const mapObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !map) {
                    initMap();
                }
            });
        }, { threshold: 0.1 });
        
        document.addEventListener('DOMContentLoaded', () => {
            const locEl = document.querySelector('.locations');
            if(locEl) mapObserver.observe(locEl);
        });

        window.addEventListener('resize', () => {
            if(map) {
                setTimeout(() => { map.invalidateSize(); }, 200);
            }
        });

        function triggerMapChange(element) {
            if(element.classList.contains('active')) return;
            document.querySelectorAll('.loc-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            const lat = parseFloat(element.getAttribute('data-lat'));
            const lng = parseFloat(element.getAttribute('data-lng'));
            const title = element.getAttribute('data-title');
            const address = element.getAttribute('data-address');
            const hours = element.getAttribute('data-hours');

            if(map) {
                map.flyTo([lat, lng], 15, {
                    animate: true,
                    duration: 1.5
                });
            }

            const mapOverlay = document.getElementById('map-premium-overlay');
            if(mapOverlay) {
                mapOverlay.classList.remove('active'); 
                setTimeout(() => {
                    document.getElementById('overlay-title').innerText = title;
                    document.getElementById('overlay-address').innerHTML = `<i class="fas fa-map-marker-alt" aria-hidden="true"></i> ${address}`;
                    document.getElementById('overlay-hours').innerHTML = `<i class="fas fa-clock" aria-hidden="true"></i> ${hours}`;
                    mapOverlay.classList.add('active'); 
                }, 300);
            }
            
            if(window.innerWidth <= 1000) {
                const mapSection = document.querySelector('.loc-map-wrapper');
                const headerOffset = 70;
                const elementPosition = mapSection.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                
                window.scrollTo({
                    top: offsetPosition,
                    behavior: "smooth"
                });
            }
        }
        
        function toggleMobileMenu() {
            const overlay = document.getElementById('mobile-menu');
            if (overlay.classList.contains('active')) {
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            } else {
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }
    </script>

    <!-- ★ Instagram Feed Loader (RSS.app -> GitHub Actions -> instagram-feed.json) -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const feedContainer = document.getElementById('instagram-feed');

            if (!feedContainer) {
                console.warn('Instagram feed container not found.');
                return;
            }

            const feedUrl = './instagram-feed.json?v=' + Date.now();

            fetch(feedUrl, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(function (response) {
                if (!response.ok) {
                    throw new Error('Instagram JSON HTTP Error: ' + response.status);
                }

                return response.text();
            })
            .then(function (text) {
                let jsonData;

                try {
                    jsonData = JSON.parse(text);
                } catch (error) {
                    console.error('Instagram JSON Parse Error:', error);
                    console.error('Received content:', text.substring(0, 500));
                    throw new Error('Instagram JSON parsing failed.');
                }

                let posts = [];

                if (Array.isArray(jsonData)) {
                    posts = jsonData;
                } else if (jsonData && Array.isArray(jsonData.data)) {
                    posts = jsonData.data;
                } else if (jsonData && Array.isArray(jsonData.items)) {
                    posts = jsonData.items;
                } else {
                    throw new Error('Instagram JSON structure is invalid.');
                }

                const validPosts = posts
                    .filter(function (post) {
                        return post &&
                            (post.media_url || post.thumbnail_url || post.image);
                    })
                    .slice(0, 6);

                if (validPosts.length === 0) {
                    throw new Error('No valid Instagram posts found.');
                }

                const fragment = document.createDocumentFragment();

                validPosts.forEach(function (post) {
                    let imageUrl =
                        post.media_url ||
                        post.image ||
                        post.thumbnail_url ||
                        '';

                    if (post.media_type === 'VIDEO' && post.thumbnail_url) {
                        imageUrl = post.thumbnail_url;
                    }

                    const permalink =
                        typeof post.permalink === 'string' &&
                        post.permalink.startsWith('http')
                            ? post.permalink
                            : 'https://www.instagram.com/sinjeon_Canada/';

                    const card = document.createElement('div');
                    card.className = 'instagram-item';

                    const link = document.createElement('a');
                    link.href = permalink;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.setAttribute('aria-label', 'View on Instagram');

                    const image = document.createElement('img');
                    image.src = imageUrl;
                    image.alt = 'Sinjeon Instagram Post';
                    image.loading = 'lazy';
                    image.decoding = 'async';

                    image.onerror = function () {
                        this.onerror = null;
                        this.src = 'sinjeon_logo_canada.png';
                        this.style.objectFit = 'contain';
                        this.style.padding = '20px';
                    };

                    const overlay = document.createElement('div');
                    overlay.className = 'instagram-overlay';

                    const icon = document.createElement('span');
                    icon.className = 'instagram-icon';

                    const instagramIcon = document.createElement('i');
                    instagramIcon.className = 'fab fa-instagram';
                    instagramIcon.setAttribute('aria-hidden', 'true');

                    icon.appendChild(instagramIcon);
                    overlay.appendChild(icon);

                    link.appendChild(image);
                    link.appendChild(overlay);
                    card.appendChild(link);

                    fragment.appendChild(card);
                });

                // 기존 skeleton 제거 후 실제 게시물 삽입
                feedContainer.replaceChildren(fragment);

                console.log(
                    'Instagram Feed Loaded Successfully:',
                    validPosts.length,
                    'posts'
                );
            })
            .catch(function (error) {
                console.error('Instagram Feed Error:', error);

                feedContainer.innerHTML = `
                    <div style="
                        grid-column: 1 / -1;
                        padding: 40px 20px;
                        background: #1f2937;
                        border-radius: 16px;
                        border: 1px dashed #374151;
                    ">
                        <i
                            class="fab fa-instagram"
                            style="
                                font-size: 2.5rem;
                                color: var(--sj-red);
                                margin-bottom: 15px;
                            "
                        ></i>

                        <h4 style="
                            font-size: 1.2rem;
                            color: white;
                            margin-bottom: 5px;
                            font-weight: 800;
                        ">
                            Feed Temporarily Unavailable
                        </h4>

                        <p style="
                            color: var(--text-light);
                            font-size: 0.95rem;
                            margin: 0;
                            font-weight: 500;
                        ">
                            Instagram feed is temporarily unavailable.
                            Please visit
                            <a
                                href="https://www.instagram.com/sinjeon_Canada"
                                target="_blank"
                                rel="noopener noreferrer"
                                style="
                                    color: var(--sj-red);
                                    text-decoration: underline;
                                "
                            >
                                @sinjeon_Canada
                            </a>
                            for the latest updates.
                        </p>
                    </div>
                `;
            });
        });
    </script>
