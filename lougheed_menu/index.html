<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinjeon Lougheed Menu</title>
    <style>
        /* 기본 배경은 고급스러운 다크 톤으로 처리 */
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px; /* 데스크탑: 8장의 메뉴판이 확실히 구분되도록 페이지 간 여백 추가 */
        }

        /* 데스크탑 최적화: Letter 사이즈(세로형) 비율 자동 유지 + 그림자 */
        .menu-img {
            width: 100%;
            max-width: 800px; 
            height: auto; /* 이미지의 원본 세로 비율(Letter)을 그대로 유지 */
            display: block;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border-radius: 4px; /* 종이 느낌의 살짝 둥근 모서리 */
        }

        /* 모바일 최적화: 화면에 꽉 차게 변경하고 여백 제거하여 끊김 없는(Seamless) 스크롤 구현 */
        @media (max-width: 768px) {
            body {
                padding: 0; 
                background-color: #000000;
                gap: 0; /* 모바일에서는 여백 제거 */
            }
            .menu-img {
                max-width: 100%;
                border-radius: 0;
                box-shadow: none; 
            }
            /* 모바일에서 이미지 간 미세한 흰 선이 생기는 것을 방지 */
            .menu-img + .menu-img {
                margin-top: -1px;
            }
        }
    </style>
</head>
<body>

    <!-- 
      [로히드 지점 세로형 8장 메뉴판]
      이미지가 존재하지 않을 경우를 대비해 onerror 속성으로 에러 방어벽 구축
    -->
    <img src="lougheed_menu_1.jpg" class="menu-img" alt="Lougheed Menu Page 1" onerror="this.style.display='none'">
    <img src="lougheed_menu_2.jpg" class="menu-img" alt="Lougheed Menu Page 2" onerror="this.style.display='none'">
    <img src="lougheed_menu_3.jpg" class="menu-img" alt="Lougheed Menu Page 3" onerror="this.style.display='none'">
    <img src="lougheed_menu_4.jpg" class="menu-img" alt="Lougheed Menu Page 4" onerror="this.style.display='none'">
    <img src="lougheed_menu_5.jpg" class="menu-img" alt="Lougheed Menu Page 5" onerror="this.style.display='none'">
    <img src="lougheed_menu_6.jpg" class="menu-img" alt="Lougheed Menu Page 6" onerror="this.style.display='none'">
    <img src="lougheed_menu_7.jpg" class="menu-img" alt="Lougheed Menu Page 7" onerror="this.style.display='none'">
    <img src="lougheed_menu_8.jpg" class="menu-img" alt="Lougheed Menu Page 8" onerror="this.style.display='none'">

</body>
</html>
