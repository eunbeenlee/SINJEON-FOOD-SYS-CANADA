<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinjeon Lougheed Menu</title>
    <style>
        body {
            margin: 0; padding: 40px 20px;
            background-color: #1a1a1a;
            display: flex; flex-direction: column;
            align-items: center; gap: 25px; 
        }
        .menu-img {
            width: 100%; max-width: 800px; height: auto;
            display: block; box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border-radius: 4px;
            /* 렌더링 최적화를 위해 이미지가 로딩되기 전 차지할 최소 높이 지정 (밀림 방지) */
            min-height: 800px; 
            background-color: #2a2a2a; /* 로딩 중 임시로 보여줄 스켈레톤 배경색 */
        }
        @media (max-width: 768px) {
            body { padding: 0; background-color: #000000; gap: 0; }
            .menu-img { max-width: 100%; border-radius: 0; box-shadow: none; min-height: 50vh; }
            .menu-img + .menu-img { margin-top: -1px; }
        }
    </style>
</head>
<body>

    <!-- 1페이지: 접속 즉시 가장 최우선으로 로딩 (fetchpriority="high") -->
    <img src="lougheed_menu_1.jpg" class="menu-img" alt="Lougheed Menu Page 1" fetchpriority="high" onerror="this.style.display='none'">
    
    <!-- 2~8페이지: 스크롤을 내릴 때 부드럽게 로딩 (loading="lazy") -->
    <img src="lougheed_menu_2.jpg" class="menu-img" alt="Lougheed Menu Page 2" loading="lazy" onerror="this.style.display='none'">
    <img src="lougheed_menu_3.jpg" class="menu-img" alt="Lougheed Menu Page 3" loading="lazy" onerror="this.style.display='none'">
    <img src="lougheed_menu_4.jpg" class="menu-img" alt="Lougheed Menu Page 4" loading="lazy" onerror="this.style.display='none'">
    <img src="lougheed_menu_5.jpg" class="menu-img" alt="Lougheed Menu Page 5" loading="lazy" onerror="this.style.display='none'">
    <img src="lougheed_menu_6.jpg" class="menu-img" alt="Lougheed Menu Page 6" loading="lazy" onerror="this.style.display='none'">
    <img src="lougheed_menu_7.jpg" class="menu-img" alt="Lougheed Menu Page 7" loading="lazy" onerror="this.style.display='none'">
    <img src="lougheed_menu_8.jpg" class="menu-img" alt="Lougheed Menu Page 8" loading="lazy" onerror="this.style.display='none'">

</body>
</html>
