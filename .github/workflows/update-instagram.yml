name: Update Instagram Feed

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Instagram JSON
        run: python scripts/update-instagram.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add instagram-feed.json

          if git diff --cached --quiet; then
            echo "No changes to Instagram feed."
          else
            git commit -m "Update Instagram feed"
            git push
          fi
