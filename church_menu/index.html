<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinjeon Church Menu</title>
    <style>
        /* 화면 여백을 0으로 만들어 PDF가 브라우저 전체를 덮도록 설정 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 이중 스크롤바 방지 */
            background-color: #333333; /* PDF 로딩 전 깔끔한 다크 배경 */
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* PDF 뷰어 미지원 기기(일부 구형 안드로이드 등)를 위한 안내 문구 스타일 */
        .fallback-message {
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            font-family: sans-serif;
            line-height: 1.6;
        }
        .fallback-message a {
            color: #D24B41;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 지정하신 PDF 파일을 브라우저 내장 뷰어로 즉시 호출합니다 -->
    <iframe src="church_menu_1.pdf" title="Sinjeon Church Menu">
        
        <!-- 브라우저 자체 뷰어가 없는 모바일 환경을 대비한 다운로드 링크 제공 -->
        <div class="fallback-message">
            미리보기를 지원하지 않는 브라우저입니다.<br><br>
            <a href="church_menu_1.pdf" download>여기를 눌러 메뉴판(PDF)을 다운로드 및 확인해 주세요.</a>
        </div>
        
    </iframe>

</body>
</html>
