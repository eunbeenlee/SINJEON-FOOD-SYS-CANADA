<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinjeon Canada Menu</title>
    <style>
        /* 전체 배경을 갤러리 느낌의 다크 톤으로 처리 */
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 데스크탑 최적화: 너무 커지지 않게 제한 + 고급스러운 그림자 효과 */
        .menu-img {
            width: 100%;
            max-width: 800px; 
            height: auto;
            display: block;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        /* 이미지가 여러 장일 경우 사이에 아주 미세한 경계선 느낌만 주어 연결감 극대화 */
        .menu-img + .menu-img {
            margin-top: -1px;
        }

        /* 모바일 최적화: 화면에 꽉 차게 변경하고 불필요한 여백/그림자 제거 */
        @media (max-width: 768px) {
            body {
                padding: 0; 
                background-color: #000000;
            }
            .menu-img {
                max-width: 100%;
                box-shadow: none; 
            }
        }
    </style>
</head>
<body>

    <!-- 
      [스마트 이미지 로더]
      폴더에 finch_menu_1.jpg ~ finch_menu_5.jpg 중 
      올려진 이미지 개수만큼만 나타나고, 
      없는 파일은 에러(onerror)를 감지해 흔적 없이 자동으로 숨깁니다.
    -->
    <img src="church_menu_1.jpg" class="menu-img" alt="Menu Page 1" onerror="this.style.display='none'">
    <img src="church_menu_2.jpg" class="menu-img" alt="Menu Page 2" onerror="this.style.display='none'">
    <img src="church_menu_3.jpg" class="menu-img" alt="Menu Page 3" onerror="this.style.display='none'">
    <img src="church_menu_4.jpg" class="menu-img" alt="Menu Page 4" onerror="this.style.display='none'">
    <img src="church_menu_5.jpg" class="menu-img" alt="Menu Page 5" onerror="this.style.display='none'">

</body>
</html>
