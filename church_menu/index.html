<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 최적화: 고객이 자유롭게 확대(Pinch-to-zoom)해서 볼 수 있도록 허용 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Sinjeon Church Menu</title>

    <style>
        /* =========================================
           1. 보안 및 복사 방지 (Anti-Theft) CSS
           ========================================= */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* 고급스러운 다크 배경 */
            
            /* 텍스트 드래그 및 선택 완벽 차단 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            
            /* 모바일에서 이미지를 꾹~ 눌러서 '저장하기' 뜨는 현상 원천 차단 */
            -webkit-touch-callout: none;
        }

        /* 인쇄(Ctrl+P) 시도 시 화면을 하얗게 가려버림 */
        @media print {
            body { display: none !important; }
        }

        /* =========================================
           2. 레이아웃 & 이미지 최적화
           ========================================= */
        .menu-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            min-height: 100vh;
            padding: 40px 20px; /* 데스크톱 상하좌우 여백 */
            box-sizing: border-box;
        }

        .menu-img {
            max-width: 1400px; /* PC 화면에서 꽉 차면서도 보기 좋은 최대 너비 */
            width: 100%;
            height: auto;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); /* 입체감 부여 */
            border-radius: 8px; /* 모서리 라운딩 */
            
            /* 이미지 마우스 드래그 방지 */
            -webkit-user-drag: none;
            user-drag: none;
            
            position: relative;
            z-index: 2;
        }

        /* 로딩 중 표시될 배경 텍스트 */
        .loading-text {
            color: #D24B41;
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            letter-spacing: 1px;
            z-index: 1;
        }

        /* =========================================
           3. 모바일 환경 100% 꽉 채우기 최적화
           ========================================= */
        @media (max-width: 768px) {
            .menu-container {
                padding: 0; /* 모바일에서는 여백 제거 */
                background-color: #000000;
            }
            .menu-img {
                max-width: 100%;
                border-radius: 0; /* 모바일은 라운딩 없이 화면 꽉 차게 */
                box-shadow: none;
            }
        }
    </style>
</head>
<!-- oncontextmenu: 마우스 우클릭 금지 / ondragstart: 드래그 금지 -->
<body oncontextmenu="return false" ondragstart="return false">

    <!-- 인터넷이 느릴 때를 대비한 초고속 로딩 안내 텍스트 -->
    <div class="loading-text">LOADING MENU... ⏳</div>

    <div class="menu-container">
        <!-- fetchpriority="high" 속성으로 브라우저가 최우선으로 다운로드하게 명령 -->
        <img src="curch_menu_1.jpg" class="menu-img" alt="Sinjeon Church Menu" fetchpriority="high">
    </div>

    <script>
        // =========================================
        // 완벽한 불펌 방지용 JS 락(Lock)
        // =========================================
        document.addEventListener('keydown', function(e) {
            // F12 (개발자 도구), Ctrl+Shift+I 차단 (코드 뜯어보기 방지)
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
            }
            // Ctrl+C (복사), Ctrl+S (저장), Ctrl+P (인쇄), Ctrl+U (소스보기) 차단
            if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 's' || e.key === 'p' || e.key === 'u')) {
                e.preventDefault();
            }
        });

        // 모바일 기기별 특이 버그(우클릭 우회)를 막기 위한 추가 락
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>

</body>
</html>
