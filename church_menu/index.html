<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinjeon Church Menu</title>
    
    <!-- PDF.js 라이브러리 (PDF를 이미지처럼 그려주는 엔진) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        /* =========================================
           1. 보안 및 복사 방지 (Anti-Theft) CSS
           ========================================= */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #1a1a1a; /* 고급스러운 다크 배경 */
            
            /* 텍스트 드래그 및 선택 완벽 차단 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            
            /* 모바일에서 길게 눌러서 메뉴 뜨는 현상 방지 */
            -webkit-touch-callout: none;
        }

        /* 인쇄 시도 시 화면을 하얗게 가려버림 */
        @media print {
            body { display: none !important; }
        }

        /* =========================================
           2. 뷰어 레이아웃 최적화
           ========================================= */
        #pdf-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px 0; /* 데스크톱 상하 여백 */
        }

        /* 렌더링된 PDF 도화지(Canvas) 스타일 */
        canvas {
            max-width: 800px; /* 데스크톱에서 너무 커지지 않게 제한 */
            width: 100%;
            height: auto;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5); /* 메뉴판 그림자 효과 */
            margin-bottom: -1px; /* 페이지 사이 뜨는 현상 방지 */
            pointer-events: none; /* 캔버스 위 우클릭/드래그 원천 차단 */
        }

        /* 로딩 스피너 UI */
        #loading {
            color: #D24B41;
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            letter-spacing: 1px;
        }

        /* 모바일 꽉 차게 최적화 */
        @media (max-width: 768px) {
            #pdf-container { padding: 0; }
            canvas { box-shadow: none; max-width: 100%; }
        }
    </style>
</head>
<!-- oncontextmenu="return false": 마우스 우클릭 방지 -->
<!-- ondragstart="return false": 드래그 방지 -->
<body oncontextmenu="return false" ondragstart="return false">

    <div id="loading">LOADING MENU... ⏳</div>
    
    <!-- PDF가 그려질 컨테이너 -->
    <div id="pdf-container"></div>

    <script>
        // PDF.js 워커 세팅
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const url = 'church_menu_1.pdf'; // 서버에 올린 PDF 파일명
        const container = document.getElementById('pdf-container');
        const loading = document.getElementById('loading');

        // 고해상도 렌더링을 위한 스케일 (스마트폰 확대 시 깨짐 방지)
        const scale = 2.0;

        // PDF 불러오기
        pdfjsLib.getDocument(url).promise.then(function(pdf) {
            loading.style.display = 'none'; // 로딩 완료 시 글자 숨김

            // PDF의 모든 페이지를 순서대로 가져와서 캔버스에 그림
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(function(page) {
                    const viewport = page.getViewport({ scale: scale });

                    // 페이지마다 캔버스 생성
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };

                    page.render(renderContext);
                    container.appendChild(canvas); // 컨테이너에 추가
                });
            }
        }).catch(function(error) {
            loading.innerHTML = "메뉴판을 불러오는 데 실패했습니다.<br>잠시 후 다시 시도해 주세요.";
            console.error('Error loading PDF:', error);
        });

        // =========================================
        // 완벽한 복사 방지용 JS 락(Lock)
        // =========================================
        document.addEventListener('keydown', function(e) {
            // F12 (개발자 도구), Ctrl+Shift+I 차단
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
            }
            // Ctrl+C (복사), Ctrl+S (저장), Ctrl+P (인쇄) 차단
            if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 's' || e.key === 'p')) {
                e.preventDefault();
            }
        });
    </script>

</body>
</html>
