<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinjeon Finch Menu</title>
    <style>
        /* 모바일에 딱 맞게 이미지를 꽉 채우고 배경을 고급스러운 어두운 톤으로 처리 */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        img {
            width: 100%;
            max-width: 600px; /* 아이패드 등에서 너무 커지지 않게 제한 */
            height: auto;
            display: block;
        }
        /* 장수가 여러 개일 경우를 대비한 여백 */
        img + img {
            margin-top: -1px; 
        }
    </style>
</head>
<body>
    <!-- 메뉴 이미지 1장일 경우 -->
    <img src="finch_menu_1.jpg" alt="Sinjeon Finch Menu">
    
    <!-- 만약 메뉴판이 2장 이상이라면 아래 주석을 풀고 사용하세요 -->
    <!-- <img src="finch_menu_2.jpg" alt="Sinjeon Finch Menu Page 2"> -->
</body>
</html>
